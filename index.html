<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Message Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Marcellus&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <p class="hero-eyebrow">Wedding Message Wall</p>
        <h1>덕담 메시지월 프로토타입</h1>
        <p class="hero-copy">
          하객용 화면과 사회자용 화면을 나눠서 먼저 정적 HTML 구조를 잡아둔 상태입니다.
        </p>
      </header>

      <main class="admin-layout">
        <section class="card-panel">
          <div class="section-head">
            <div>
              <p class="section-kicker">Guest</p>
              <h2>하객용 사이트</h2>
            </div>
          </div>
          <p class="hero-copy" style="margin: 0; width: 100%;">
            QR 코드로 연결될 화면입니다. 메시지월 확인과 덕담 입력 폼이 함께 들어 있습니다.
          </p>
          <p style="margin: 20px 0 0;">
            <a class="primary-button" href="./guest.html" style="display: inline-block; text-decoration: none;">
              하객 화면 열기
            </a>
          </p>
        </section>

        <section class="card-panel">
          <div class="section-head">
            <div>
              <p class="section-kicker">Admin</p>
              <h2>사회자용 사이트</h2>
            </div>
          </div>
          <p class="hero-copy" style="margin: 0; width: 100%;">
            덕담 접수 상태를 제어하고, 등록자 중 랜덤 추첨 결과를 보여주는 화면입니다.
          </p>
          <p style="margin: 20px 0 0;">
            <a class="secondary-button" href="./admin.html" style="display: inline-block; text-decoration: none;">
              관리자 화면 열기
            </a>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
