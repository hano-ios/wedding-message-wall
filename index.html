<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#fff7fa" />
    <title>Wedding Message Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Marcellus&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=index-light-1" />
    <style>
      .developer-gate {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .developer-gate-card {
        width: min(640px, 100%);
        padding: 40px 32px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 32px;
        background: linear-gradient(180deg, rgba(255, 254, 251, 0.96), rgba(249, 244, 236, 0.96));
        box-shadow: 0 24px 60px rgba(133, 146, 118, 0.14);
        text-align: center;
      }

      .developer-gate-eyebrow {
        margin: 0 0 14px;
        color: #7e9e77;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }

      .developer-gate-card h1 {
        margin: 0;
        color: #3b4a3d;
        font-family: "Marcellus", serif;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 400;
      }

      .developer-gate-copy {
        margin: 24px 0 0;
        color: #5f725d;
        font-size: 1.04rem;
        line-height: 1.9;
      }

      .developer-gate-action {
        margin-top: 28px;
      }

      .developer-gate-action .primary-button {
        display: inline-block;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="developer-gate">
      <section class="developer-gate-card">
        <p class="developer-gate-eyebrow">For Developers</p>
        <h1>개발자분들께:</h1>
        <p class="developer-gate-copy">
          혹시나하는 마음에 당부드립니다.
          <br />
          제가 의도하지 않은 동작을 테스트하지 말아주세요
          <br />
          QA를 거치지 않은 배포라 굉장히 마음이 두렵습니다
        </p>
        <p class="developer-gate-action">
          <a class="primary-button" href="./guest.html">모른척 하객용 페이지 열기</a>
        </p>
      </section>
    </main>

    <script>
      const consoleBannerStyle = [
        "background: linear-gradient(135deg, #7e9e77, #9bb794)",
        "color: #fffef9",
        "padding: 10px 14px",
        "border-radius: 10px",
        "font-size: 14px",
        "font-weight: 700",
      ].join(";");

      const consoleBodyStyle = [
        "color: #4f634d",
        "font-size: 13px",
        "line-height: 1.7",
      ].join(";");

      console.log("%c개발자님, 이상한 짓 하지 말아 주세요", consoleBannerStyle);
      console.log(
        "%c여기는 개발자 전용 입구입니다.\n하객 메시지와 운영 데이터는 살살 다뤄 주세요.\n버그 제보는 감사하지만 예기치 않은 테스트는 제 심장에 무리입니다.",
        consoleBodyStyle
      );
    </script>
  </body>
</html>
