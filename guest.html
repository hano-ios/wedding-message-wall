<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>축하 메시지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Marcellus&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=guest-mobile-37" />
  </head>
  <body class="guest-page">
    <div class="page-shell">
      <section class="guest-loading-screen" id="guest-loading-screen" aria-live="polite">
        <p class="guest-loading-label">Loading</p>
      </section>

      <main class="guest-stage" id="guest-stage" hidden>
        <section class="guest-wall-section">
          <div class="guest-wall-copy">
            <h1>덕담을 남겨주세요</h1>
            <p>
              오늘 이곳에 남겨주신 한마디는 저희 부부의 디지털 방명록으로 보관됩니다.
              <br />
              몇 년 뒤 다시 찾아와도, 여러분의 축하를 그대로 만날 수 있습니다.
            </p>
          </div>

          <section class="winner-banner guest-winner-banner" id="winner-banner" hidden>
            <p class="winner-badge" id="winner-banner-title">당첨자</p>
            <div id="winner-banner-bubble"></div>
          </section>

          <div class="guest-wall-board" id="message-wall"></div>

          <section class="message-spotlight" id="message-spotlight" hidden>
            <div class="message-spotlight-card">
              <p class="winner-badge">새로 도착한 메시지</p>
              <h2 id="spotlight-name"></h2>
              <p id="spotlight-message"></p>
            </div>
          </section>

          <a class="guest-scroll-cta" href="#guest-form-section">아래로 내려 덕담 남기기</a>
        </section>

        <section class="guest-form-section card-panel" id="guest-form-section">
          <div class="section-head guest-form-head">
            <div>
              <h2>메시지를 남겨주세요</h2>
            </div>
          </div>

          <form class="message-form" id="message-form">
            <div class="guest-form-card">
              <label class="field">
                <span>이름/닉네임 (실명을 권장합니다)</span>
                <input
                  id="nickname"
                  name="nickname"
                  type="text"
                  maxlength="12"
                  placeholder="예: 민수"
                  required
                />
              </label>

              <label class="field">
                <span>메시지</span>
                <textarea
                  id="message"
                  name="message"
                  maxlength="120"
                  rows="5"
                  placeholder="신랑 신부에게 전하고 싶은 마음을 적어주세요."
                  required
                ></textarea>
              </label>
            </div>

            <div class="guest-form-meta-block">
              <p id="form-status-text"></p>
            </div>

            <button class="primary-button guest-submit-button" id="submit-button" type="submit">보내기</button>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="./guest.js?v=guest-mobile-37"></script>
  </body>
</html>
